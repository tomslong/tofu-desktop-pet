name: Release Windows MSI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-msi:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build MSI
        shell: pwsh
        run: npm run dist

      - name: Prepare checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $msi = "release/Tofu-$version-x64.msi"
          if (!(Test-Path $msi)) { throw "MSI not found at $msi" }
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          $name = Split-Path $msi -Leaf
          "$hash  $name" | Set-Content -Encoding ascii "$msi.sha256"
          Get-ChildItem release | Select-Object Name, Length
          Write-Output "MSI_SHA256=$hash"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $msi = "release/Tofu-$version-x64.msi"
          $sha = "$msi.sha256"
          $notes = ".github/release-notes/$env:RELEASE_TAG.md"
          if (!(Test-Path $notes)) { $notes = $null }
          $title = "Tofu $env:RELEASE_TAG"

          gh release view $env:RELEASE_TAG --json tagName *> $null
          $exists = $LASTEXITCODE -eq 0

          if ($exists) {
            gh release upload $env:RELEASE_TAG $msi $sha --clobber
            if ($notes) {
              gh release edit $env:RELEASE_TAG --title $title --notes-file $notes --latest
            } else {
              gh release edit $env:RELEASE_TAG --title $title --latest
            }
          } else {
            if ($notes) {
              gh release create $env:RELEASE_TAG $msi $sha --title $title --notes-file $notes --latest
            } else {
              gh release create $env:RELEASE_TAG $msi $sha --title $title --generate-notes --latest
            }
          }
