<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tofu</title>
    <link rel="icon" href="../assets/icon.png" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/pet.css" />
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
      <symbol id="i-heart" viewBox="0 0 16 16">
        <rect x="5" y="3" width="2" height="1" />
        <rect x="9" y="3" width="2" height="1" />
        <rect x="4" y="4" width="8" height="2" />
        <rect x="5" y="6" width="6" height="1" />
        <rect x="6" y="7" width="4" height="1" />
        <rect x="7" y="8" width="2" height="1" />
      </symbol>
      <symbol id="i-cookie" viewBox="0 0 16 16">
        <rect x="4" y="2" width="8" height="1" />
        <rect x="3" y="3" width="10" height="1" />
        <rect x="2" y="4" width="12" height="6" />
        <rect x="3" y="10" width="10" height="2" />
        <rect x="4" y="12" width="8" height="1" />
        <rect x="5" y="13" width="4" height="1" />
        <rect x="5" y="5" width="2" height="2" fill="#fff8e9" />
        <rect x="10" y="4" width="1" height="2" fill="#fff8e9" />
        <rect x="8" y="8" width="2" height="1" fill="#fff8e9" />
        <rect x="4" y="8" width="1" height="2" fill="#fff8e9" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 16 16">
        <rect x="4" y="3" width="2" height="10" />
        <rect x="6" y="5" width="2" height="6" />
        <rect x="8" y="6" width="2" height="4" />
        <rect x="10" y="7" width="2" height="2" />
      </symbol>
      <symbol id="i-gear" viewBox="0 0 16 16">
        <rect x="6" y="1" width="4" height="2" />
        <rect x="6" y="13" width="4" height="2" />
        <rect x="1" y="6" width="2" height="4" />
        <rect x="13" y="6" width="2" height="4" />
        <rect x="4" y="4" width="8" height="8" />
        <rect x="6" y="6" width="4" height="4" fill="#fff8e9" />
      </symbol>
    </svg>

    <main class="pet-root" id="pet-root">
      <div class="bubble-wrap">
        <div class="agent-chip" id="agent-chip" aria-hidden="true">
          <span class="pulse"></span>
          <span id="agent-label">AGENT / WORKING</span>
        </div>
        <div class="bubble" id="bubble" role="status" aria-live="polite" hidden>
          <p class="bubble-text" id="bubble-text"></p>
          <button class="bubble-close" id="bubble-close" type="button" aria-label="Dismiss message">×</button>
        </div>
      </div>

      <div
        class="stage"
        id="stage"
        data-interactive
        role="button"
        tabindex="0"
        aria-label="Tofu, your desktop pet. Click to pet, drag to move, right-click for more."
        title="摸摸 · 拖动 · 右键菜单"
      >
        <canvas id="pet" width="64" height="64" aria-hidden="true"></canvas>
      </div>

      <div class="dock" id="dock" data-interactive>
        <span class="dock-name" id="dock-name">TOFU</span>
        <span class="dock-sep"></span>
        <span class="dock-status" id="dock-status">just vibing</span>
        <div class="dock-actions">
          <button type="button" data-action="pet" title="摸摸 Tofu" aria-label="Pet Tofu">
            <svg class="icon"><use href="#i-heart"></use></svg>
          </button>
          <button type="button" data-action="feed" title="投喂一块小饼干" aria-label="Feed Tofu">
            <svg class="icon"><use href="#i-cookie"></use></svg>
            <span class="treat-count" id="treat-count" hidden></span>
          </button>
          <button type="button" data-action="play" title="陪 Tofu 玩一下" aria-label="Play with Tofu">
            <svg class="icon"><use href="#i-play"></use></svg>
          </button>
          <button type="button" data-action="settings" title="设置" aria-label="Open settings">
            <svg class="icon"><use href="#i-gear"></use></svg>
          </button>
        </div>
      </div>
    </main>

    <script type="module" src="renderer/pet.js"></script>
  </body>
</html>
